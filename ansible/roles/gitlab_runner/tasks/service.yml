---
- name: Enable Podman API socket
  become: true
  become_user: "{{ gitlab_runner_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ gitlab_runner_user_uid }}"
  ansible.builtin.systemd:
    name: podman.socket
    scope: user
    state: started
    enabled: true

- name: Ensure Quadlet directory exists
  become: true
  become_user: "{{ gitlab_runner_user }}"
  ansible.builtin.file:
    path: "/home/{{ gitlab_runner_user }}/.config/containers/systemd"
    state: directory
    mode: "0755"

- name: Deploy GitLab Runner Quadlet unit
  become: true
  become_user: "{{ gitlab_runner_user }}"
  ansible.builtin.template:
    src: gitlab-runner.container.j2
    dest: "/home/{{ gitlab_runner_user }}/.config/containers/systemd/{{ gitlab_runner_service_name }}.container"
    mode: "0644"
  notify:
    - Reload GitLab Runner user systemd daemon
    - Restart GitLab Runner service

- name: Flush GitLab Runner service handlers
  ansible.builtin.meta: flush_handlers

- name: Start and enable GitLab Runner service
  become: true
  become_user: "{{ gitlab_runner_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ gitlab_runner_user_uid }}"
  ansible.builtin.systemd:
    name: "{{ gitlab_runner_service_name }}.service"
    scope: user
    state: restarted
    enabled: true
...
