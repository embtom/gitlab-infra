---
- name: Debug Message
  ansible.builtin.debug:
    msg: "Start installation of Gitlab Runner"

- name: Check if GitLab Runner is registered
  ansible.builtin.include_tasks: is_registered.yml

- name: Create and configure service user
  become: true
  block:
    - name: Include service user tasks
      ansible.builtin.include_tasks: user.yml

- name: Validate GitLab Runner container method
  ansible.builtin.assert:
    that:
      - gitlab_runner_container_method in ['direct-build', 'image_pull']
    fail_msg: >-
      gitlab_runner_container_method must be either 'direct-build' or 'image_pull'.

- name: Build and transfer GitLab Runner images
  become: true
  when: gitlab_runner_container_method == 'direct-build'
  block:
    - name: Include image build tasks
      ansible.builtin.include_tasks: image_build.yml

- name: Pull GitLab Runner images
  become: true
  when: gitlab_runner_container_method == 'image_pull'
  block:
    - name: Include image pull tasks
      ansible.builtin.include_tasks: image_pull.yml

- name: Register GitLab Runner
  ansible.builtin.include_tasks: register.yml

- name: Deploy GitLab Runner service
  ansible.builtin.include_tasks: service.yml
...
