---
- name: Check GitLab LDAP CA certificate on controller
  ansible.builtin.stat:
    path: "{{ gitlab_service_ldap_ca_certificate }}"
  delegate_to: localhost
  become: false
  register: gitlab_service_ldap_ca_certificate_info
  when: gitlab_service_ldap_enabled | bool

- name: Validate GitLab LDAP settings
  when: gitlab_service_ldap_enabled | bool
  ansible.builtin.assert:
    that:
      - gitlab_service_ldap_host | length > 0
      - gitlab_service_ldap_base | length > 0
      - gitlab_service_ldap_uid | length > 0
      - gitlab_service_ldap_bind_dn | length > 0
      - gitlab_service_ldap_bind_password | length > 0
      - gitlab_service_ldap_ca_certificate_info.stat.isreg
    fail_msg: >-
      Set GitLab LDAP host, base, uid, bind credentials, and a readable CA
      certificate before enabling gitlab_service_ldap_enabled.
  no_log: true

- name: Stop and remove container service
  become: true
  block:
    - name: Include teardown tasks
      ansible.builtin.include_tasks: teardown.yml

- name: Create and configure service user
  become: true
  block:
    - name: Include service user tasks
      ansible.builtin.include_tasks: user.yml

- name: Pull GitLab image
  become: true
  block:
    - name: Include image pull tasks
      ansible.builtin.include_tasks: image_pull.yml

- name: Ensure GitLab volumes exist
  become: true
  block:
    - name: Include volume tasks
      ansible.builtin.include_tasks: volume.yml

- name: Deploy and start GitLab service
  become: true
  block:
    - name: Include service tasks
      ansible.builtin.include_tasks: service.yml

- name: Wait for GitLab and apply post-start settings
  become: true
  block:
    - name: Include readiness tasks
      ansible.builtin.include_tasks: readiness.yml
