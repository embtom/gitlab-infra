---
- name: Validate GitLab data directory before recreating data
  when: gitlab_service_volume_recreate | default(false) | bool
  become: true
  ansible.builtin.assert:
    that:
      - gitlab_service_data_dir is match('^/.+')
      - gitlab_service_data_dir != '/'
    fail_msg: >-
      gitlab_service_data_dir must be a non-root absolute path; got
      '{{ gitlab_service_data_dir }}'.

- name: Remove GitLab data subdirectories when recreating data
  when: gitlab_service_volume_recreate | default(false) | bool
  become: true
  ansible.builtin.file:
    path: "{{ gitlab_service_data_dir }}/{{ item }}"
    state: absent
  loop:
    - config
    - logs
    - data

- name: Create GitLab data directories
  become: true
  ansible.builtin.file:
    path: "{{ gitlab_service_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ gitlab_service_user }}"
    group: "{{ gitlab_service_user }}"
    mode: "0750"
  loop:
    - config
    - logs
    - data

# The OpenSSH daemon bundled in the image isn't exposed as a Chef attribute
- name: Create OpenSSH "down" marker file
  become: true
  ansible.builtin.file:
    path: "{{ gitlab_service_data_dir }}/sshd-down"
    state: touch
    owner: "{{ gitlab_service_user }}"
    group: "{{ gitlab_service_user }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
