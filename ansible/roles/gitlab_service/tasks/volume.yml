---
- name: Validate GitLab storage directories before recreating data
  when: gitlab_service_volume_recreate | default(false) | bool
  become: true
  ansible.builtin.assert:
    that:
      - item is match('^/.+')
      - item != '/'
    fail_msg: >-
      GitLab storage directories must be non-root absolute paths; got '{{ item }}'.
  loop:
    - "{{ gitlab_service_config_dir }}"
    - "{{ gitlab_service_logs_dir }}"
    - "{{ gitlab_service_data_dir }}"

- name: Remove GitLab storage directories when recreating data
  when: gitlab_service_volume_recreate | default(false) | bool
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ gitlab_service_config_dir }}"
    - "{{ gitlab_service_logs_dir }}"
    - "{{ gitlab_service_data_dir }}"

- name: Create GitLab storage directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gitlab_service_user }}"
    group: "{{ gitlab_service_user }}"
    mode: "0750"
  loop:
    - "{{ gitlab_service_config_dir }}"
    - "{{ gitlab_service_logs_dir }}"
    - "{{ gitlab_service_data_dir }}"

- name: Create GitLab TLS directory
  become: true
  ansible.builtin.file:
    path: "{{ gitlab_service_tls_dir }}"
    state: directory
    owner: "{{ gitlab_service_user }}"
    group: "{{ gitlab_service_user }}"
    mode: "0700"

- name: Deploy GitLab TLS private key
  become: true
  ansible.builtin.copy:
    src: "{{ pki_gitlab_private_key }}"
    dest: "{{ gitlab_service_tls_private_key }}"
    owner: "{{ gitlab_service_user }}"
    group: "{{ gitlab_service_user }}"
    mode: "0600"
  no_log: true

- name: Deploy GitLab TLS certificate chain
  become: true
  ansible.builtin.copy:
    content: |-
      {{ lookup('ansible.builtin.file', pki_gitlab_certificate) }}
      {{ lookup('ansible.builtin.file', pki_intermediate_ca_certificate) }}
    dest: "{{ gitlab_service_tls_certificate }}"
    owner: "{{ gitlab_service_user }}"
    group: "{{ gitlab_service_user }}"
    mode: "0644"
