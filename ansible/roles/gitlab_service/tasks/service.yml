---
- name: Create Podman network {{ gitlab_service_name }}
  become: true
  become_user: "{{ gitlab_service_user }}"
  containers.podman.podman_network:
    name: "{{ gitlab_service_net }}"
    state: present
    driver: bridge
    subnet: 10.100.0.0/24
    gateway: 10.100.0.1

- name: Ensure Quadlet directory exists
  become: true
  become_user: "{{ gitlab_service_user }}"
  ansible.builtin.file:
    path: "/home/{{ gitlab_service_user }}/.config/containers/systemd"
    state: directory
    mode: "0755"

# Deployed straight into the named volume's backing directory so GitLab's
# own gitlab-ctl reconfigure reads it directly - no GITLAB_OMNIBUS_CONFIG
# env var/eval step needed. Omnibus only auto-generates a default gitlab.rb
# when the file is missing, so seeding it here before first start means our
# version is used from the very first boot.
- name: Deploy GitLab configuration (gitlab.rb)
  become: true
  become_user: "{{ gitlab_service_user }}"
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: "/home/{{ gitlab_service_user }}/.local/share/containers/storage/volumes/gitlab_config/_data/gitlab.rb"
    mode: "0600"
  notify:
    - Reload user systemd daemon
    - Restart GitLab service

- name: Deploy Quadlet container unit
  become: true
  become_user: "{{ gitlab_service_user }}"
  ansible.builtin.template:
    src: gitlab.container.j2
    dest: "/home/{{ gitlab_service_user }}/.config/containers/systemd/{{ gitlab_service_name }}.container"
    mode: "0644"
  notify:
    - Reload user systemd daemon
    - Restart GitLab service

# A freshly deployed Quadlet definition is not visible to systemd until its
# user daemon reloads. Handlers normally run at the end of a play, so run the
# notified handlers now before attempting the initial start below.
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# Start and enable the unit; handlers restart it only after changes.
- name: Start and enable GitLab service
  become: true
  become_user: "{{ gitlab_service_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ gitlab_service_user_uid }}"
  ansible.builtin.systemd:
    name: "{{ gitlab_service_name }}.service"
    scope: user
    state: started
    enabled: true
