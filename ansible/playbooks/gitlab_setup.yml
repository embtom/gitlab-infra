---
- name: Set up GitLab
  hosts: all
  become: false

  vars:
    gitlab_external_host: >-
      {{ ansible_facts['fqdn'] | default(ansible_facts['hostname'], true) }}
    gitlab_service_tls_certificate_name: >-
      {{ gitlab_external_host | regex_replace('[^A-Za-z0-9._-]', '_') }}-gitlab
    pki_server_certificates:
      - name: "{{ gitlab_service_tls_certificate_name }}"
        common_name: "{{ gitlab_external_host }}"
        subject_alt_names:
          - "DNS:{{ gitlab_external_host }}"

  pre_tasks:
    - name: Show deployment target
      ansible.builtin.debug:
        msg: "Deploying to {{ inventory_hostname }} ({{ ansible_host | default(inventory_hostname) }})"
      tags: [always]

  roles:
    - role: pki
      tags: [pki, service]
    - role: gitlab_service
      tags: [service]
    - role: gitlab_runner
      tags: [runner]
    - role: gitlab_user_provision
      tags: [provision_user]
      when: gitlab_service_provision_user_name is defined
